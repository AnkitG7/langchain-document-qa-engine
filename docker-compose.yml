version: "3.8"

services:
  # DocMind Multi-Worker FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PGVECTOR_URL=postgresql+psycopg://docmind_user:docmind_password@postgres:5432/docmind_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # PostgreSQL + PGVector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: docmind_db
      POSTGRES_USER: docmind_user
      POSTGRES_PASSWORD: docmind_password
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind_user -d docmind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Subsystem
  redis:
    image: redis:7-alpine
    container_name: docmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
    driver: local
  redis_data:
    driver: local
